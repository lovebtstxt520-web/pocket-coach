<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>Pocket Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#1f2a24;--mute:#6b736c;--line:#e4ddcd;--brand:#1f6f54;--brand-ink:#fff;--soft:#e3efe8;--warn:#b4532a;--warn-soft:#f8e6dc;--gold:#c58a1a;--gold-soft:#f7ecd2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1d231f;--ink:#e9ece7;--mute:#9aa39c;--line:#2e3631;--brand:#4fb58b;--brand-ink:#0f1612;--soft:#20352b;--warn:#f08b62;--warn-soft:#3a2219;--gold:#e5b34f;--gold-soft:#3a2f17}}
:root[data-theme="dark"]{--bg:#141815;--card:#1d231f;--ink:#e9ece7;--mute:#9aa39c;--line:#2e3631;--brand:#4fb58b;--brand-ink:#0f1612;--soft:#20352b;--warn:#f08b62;--warn-soft:#3a2219;--gold:#e5b34f;--gold-soft:#3a2f17}
:root[data-theme="flow"]{--bg:#0b0d1c;--card:#161a33;--ink:#eef0ff;--mute:#9ba2cc;--line:#283058;--brand:#6d7bff;--brand-ink:#fff;--soft:#222a57;--warn:#ff7d8a;--warn-soft:#3a1d2c;--gold:#c79bff;--gold-soft:#2a2150;--wallet:linear-gradient(135deg,#2f54ff,#8b3dff);--bgimg:radial-gradient(900px 500px at 100% -10%,rgba(139,61,255,.35),transparent 60%),radial-gradient(700px 500px at -20% 10%,rgba(47,84,255,.28),transparent 60%)}
:root[data-theme="purple"]{--bg:#1a1326;--card:#241b35;--ink:#efe8f8;--mute:#a99cbf;--line:#3a2d52;--brand:#b18cff;--brand-ink:#1a1326;--soft:#32264a;--warn:#ff8f7a;--warn-soft:#3d2125;--gold:#f0c46a;--gold-soft:#3a2e1c}
:root[data-theme="cream"]{--bg:#f8efd9;--card:#fffaee;--ink:#3a2f22;--mute:#857762;--line:#eadcbc;--brand:#a0672a;--brand-ink:#fff;--soft:#f1e3c3;--warn:#b4532a;--warn-soft:#f6e0d2;--gold:#c58a1a;--gold-soft:#f3e2b6}
:root[data-theme="olive"]{--bg:#eceee0;--card:#f8f9f1;--ink:#2b3020;--mute:#6f765f;--line:#d9ddc6;--brand:#5b6a36;--brand-ink:#fff;--soft:#dfe4cc;--warn:#a8532e;--warn-soft:#f1dfd3;--gold:#a8862a;--gold-soft:#ece3c3}
:root[data-theme="rose"]{--bg:#f7e8eb;--card:#fff7f8;--ink:#3b2529;--mute:#8a6d73;--line:#ecd3d8;--brand:#b0496a;--brand-ink:#fff;--soft:#f2d8de;--warn:#b4532a;--warn-soft:#f6e0d2;--gold:#b77b2b;--gold-soft:#f3e4cd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);background-image:var(--bgimg,none);background-attachment:fixed;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans Thai",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--mute);font-size:14px}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wallet{margin:16px 0 10px;background:var(--wallet,var(--brand));color:var(--brand-ink);border-radius:22px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.wallet .k{font-size:13px;opacity:.85}
.wallet .v{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.wallet .s{font-size:13px;opacity:.85;margin-top:2px}
.wallet button{border:0;border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.18);color:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.wallet.low{background:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--mute)}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:10px}
.quick input{flex:1;min-width:0;border:0;background:transparent;padding:10px;outline:none}
.qbtn{border:0;border-radius:12px;width:44px;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--soft);color:var(--ink)}
.qbtn.go{background:var(--brand);color:var(--brand-ink)}
.qbtn.rec{background:var(--warn);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;text-decoration:none}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.gold{background:var(--gold);color:#fff}
.btn.full{width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.acts .btn{flex:1 1 120px}
.day{font-size:12px;color:var(--mute);margin:14px 4px 6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.row .main{flex:1;min-width:0}
.row .t{margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{margin:0;font-size:13px;color:var(--mute)}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--soft);margin-left:4px;vertical-align:1px}
.tag.transfer{background:#dfe8f6;color:#2f5f9e}.tag.card{background:#eee3f3;color:#7a4a92}
.src{margin:2px 0 0;font-size:11px;color:var(--mute);opacity:.8}
.empty{text-align:center;color:var(--mute);padding:28px 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.muted{color:var(--mute);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.hd h3{margin:0;font-size:20px}
.fld{margin-bottom:10px}
.fld label,.lbl{display:block;font-size:12px;color:var(--mute);margin:0 0 3px}
.fld input,.fld select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:var(--soft);margin-bottom:10px}
.spin{display:flex;align-items:center;gap:10px;padding:16px 4px;color:var(--mute)}
.spin i{width:18px;height:18px;border:3px solid var(--soft);border-top-color:var(--brand);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.errbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.errdetail{margin-top:6px;font-size:11px;opacity:.65;word-break:break-word}
.ai{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.ai ul{margin:6px 0 0;padding-left:18px}
.byline{margin-top:8px;font-size:12px;font-weight:600;color:var(--brand)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.qe{display:grid;grid-template-columns:auto 1fr 90px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qe input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.qe .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.qe .nm input,.qe .nm select,.qe .am{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.qe .meta{display:flex;gap:6px}
.qe .meta select{flex:1;font-size:13px;padding:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:186px;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--brand)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.view{display:none}.view.on{display:block}
.savedtile{margin:16px 0 10px;background:var(--gold-soft);border-radius:22px;padding:16px 18px;color:var(--ink)}
.savedtile .k{font-size:13px;color:var(--mute)}
.savedtile .v{font-size:32px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.15}
.savedtile .s{font-size:13px;color:var(--mute);margin-top:2px}
.stat.click{cursor:pointer}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;cursor:pointer}
.wcard.ready{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.wcard.done{opacity:.6}
.wthumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--mute);font-size:24px;font-weight:700}
.wcard .main{flex:1;min-width:0}
.wcard .t{margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .p{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.wcard .hrs{font-weight:500;color:var(--mute);font-size:13px}
.wcard .s{margin:4px 0 0;font-size:13px;color:var(--mute)}
.wcard .s.go{color:var(--gold);font-weight:600}
.bar{height:5px;border-radius:99px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.qs{margin:6px 0 0;padding-left:20px}.qs li{margin-bottom:4px}
.hrsbig{font-size:14px;color:var(--mute);margin:-4px 0 10px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-bottom:12px}
.sw button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.sw button.on{border:2px solid var(--ink)}
.sw i{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:30;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Pocket Coach</h1><p class="sub" data-i18n="app_sub"></p></div>
    <button class="ibtn" id="btnSettings" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <section class="view on" id="viewSpend">
  <div class="wallet" id="walletCard">
    <div><div class="k" data-i18n="wallet_left"></div><div class="v" id="vWallet">-</div><div class="s" id="wSub"></div></div>
    <button id="btnWallet" data-i18n="wallet_set"></button>
  </div>
  <div class="stats">
    <div class="stat"><div class="k" data-i18n="today_spent"></div><div class="v" id="vToday">-</div></div>
    <div class="stat"><div class="k" data-i18n="month_spent"></div><div class="v" id="vMonth">-</div></div>
  </div>

  <form class="quick" id="quickForm" autocomplete="off">
    <input id="quickIn" enterkeyhint="send">
    <button type="button" class="qbtn" id="btnMic" aria-label="voice" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="submit" class="qbtn go" aria-label="add"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <div class="acts">
    <label class="btn"><span data-i18n="scan_receipt"></span><input type="file" accept="image/*" capture="environment" id="fCam"></label>
    <label class="btn sec"><span data-i18n="from_gallery"></span><input type="file" accept="image/*" id="fGal"></label>
    <button class="btn sec" id="btnManual" data-i18n="add_manual"></button>
  </div>
  <div id="expList"></div>
  </section>

  <section class="view" id="viewWant">
  <div class="savedtile"><div class="k" data-i18n="saved_pause"></div><div class="v" id="vSaved">-</div><div class="s" id="savedSub"></div></div>
  <div class="stats">
    <div class="stat"><div class="k" data-i18n="waiting_now"></div><div class="v" id="vWaiting">-</div></div>
    <div class="stat click" id="wageTile"><div class="k" data-i18n="wage_tile"></div><div class="v" id="vWage">-</div></div>
  </div>
  <p class="muted" data-i18n="want_hint" style="margin:0 4px 10px"></p>
  <div class="acts">
    <label class="btn gold"><span data-i18n="wish_shot"></span><input type="file" accept="image/*" id="fWish"></label>
    <button class="btn sec" id="btnWishManual" data-i18n="wish_manual"></button>
  </div>
  <div id="wishList"></div>
  </section>
</div>

<nav class="tabs">
  <button class="on" data-tab="Spend"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 10h18"/></svg><span data-i18n="tab_spend"></span></button>
  <button data-tab="Want"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span data-i18n="tab_want"></span><span class="badge" id="wantBadge" hidden></span></button>
</nav>
<div id="sheetWish" class="ov"><div class="sheet" id="wishBody"></div></div>
<div id="sheetWage" class="ov"><div class="sheet">
  <div class="hd"><h3 data-i18n="wage_title"></h3><button class="btn sec" data-close="sheetWage" data-i18n="cancel"></button></div>
  <p class="muted" data-i18n="wage_hint" style="margin-top:0"></p>
  <div class="fld"><label data-i18n="wage_label"></label><input id="inWage" type="number" min="0" step="1" inputmode="decimal"></div>
  <button class="btn full" id="btnWageSave" data-i18n="save"></button>
</div></div>

<div id="sheetExp" class="ov"><div class="sheet" id="expBody"></div></div>
<div id="sheetQuick" class="ov"><div class="sheet" id="quickBody"></div></div>
<div id="sheetWallet" class="ov"><div class="sheet">
  <div class="hd"><h3 data-i18n="wallet_title"></h3><button class="btn sec" data-close="sheetWallet" data-i18n="cancel"></button></div>
  <p class="muted" data-i18n="wallet_hint" style="margin-top:0"></p>
  <div class="fld"><label data-i18n="wallet_now"></label><input id="inWallet" type="number" min="0" step="1" inputmode="decimal"></div>
  <button class="btn full" id="btnWalletSave" data-i18n="save"></button>
  <button class="btn sec full" id="btnWalletAdd" data-i18n="wallet_add"></button>
</div></div>
<div id="sheetSet" class="ov"><div class="sheet">
  <div class="hd"><h3 data-i18n="settings"></h3><button class="btn sec" data-close="sheetSet" data-i18n="close"></button></div>
  <div class="fld"><label data-i18n="language"></label><select id="selLang"></select></div>
  <p class="lbl" data-i18n="theme"></p><div class="sw" id="themeSw"></div>
  <div class="fld"><label data-i18n="wage_label"></label><input id="setWage" type="number" min="0" step="1" inputmode="decimal"></div>
  <label style="display:flex;gap:10px;align-items:center;padding:8px 2px"><input type="checkbox" id="chkSrc" style="width:20px;height:20px;accent-color:var(--brand)"> <span data-i18n="show_src"></span></label>
  <p class="muted" style="text-align:center;margin:14px 0 0" id="verLbl"></p>
  <button class="btn warn full" id="btnClear" style="margin-top:14px" data-i18n="clear_all"></button>
</div></div>
<div id="toast" class="toast"></div>

<script>
const VERSION = "2";
// ===== TRANSLATIONS (every language must have exactly the same keys) =====
const T = {
en:{app_sub:"Your pocket money coach.",wallet_left:"Cash left in wallet",wallet_set:"Set wallet",wallet_unset:"Tap Set wallet to start",wallet_since:"Since {d} · spent {a}",wallet_title:"Cash in your wallet",wallet_hint:"Count the cash in your wallet now. Pocket subtracts every cash spending after this.",wallet_now:"I have this much cash now (THB)",wallet_add:"Add to wallet (ATM, top up)",wallet_added:"Added {a} to wallet",today_spent:"Spent today",month_spent:"Spent this month",
quick_ph:"e.g. chicken rice 50, taxi 80",quick_title:"Check and save",quick_none:"I could not find any amounts. Try something like \"noodles 60\".",save_all:"Save {n}",scan_receipt:"Scan receipt",from_gallery:"Choose photo",add_manual:"Add by hand",
empty_exp:"No spending yet",empty_exp_hint:"Type what you spent above, or snap a receipt or a transfer slip.",reading:"Reading...",new_exp:"New spending",edit_exp:"Edit spending",amount:"Amount",merchant:"Where / what",merchant_ph:"e.g. 7-Eleven",category:"Category",method:"Paid with",m_cash:"Cash",m_transfer:"QR / transfer",m_card:"Card",date:"Date",note:"Note",save:"Save",cancel:"Cancel",delete:"Delete",close:"Close",

const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast("Storage full"); return false; } };
const navLang = (navigator.language || "").toLowerCase();
let lang = lsGet("pc_lang", navLang.startsWith("th") ? "th" : navLang.startsWith("zh") ? "zh" : "en");

function t(k, vars) {
  let s = (T[lang] && T[lang][k]) || T.en[k] || k;
  if (vars) Object.keys(vars).forEach(v => { s = s.split("{" + v + "}").join(vars[v]); });
  return s;
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function money(a, cur) {
  try { return new Intl.NumberFormat(LOC[lang], { style: "currency", currency: cur || "THB", currencyDisplay: "narrowSymbol", maximumFractionDigits: a % 1 ? 2 : 0 }).format(a || 0); }
  catch (e) { return (cur || "THB") + " " + (a || 0); }
}
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const monthStart = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const toDateInput = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fromDateInput = (s, keep) => { const p = String(s).split("-").map(Number); if (p.length < 3 || !p[0]) return keep || Date.now(); const k = new Date(keep || Date.now()); return new Date(p[0], p[1] - 1, p[2], k.getHours(), k.getMinutes()).getTime(); };
function dayLabel(ts) {
  const d = startOfDay(ts), today = startOfDay(Date.now());
  if (d === today) return t("today");
  if (d === today - DAY) return t("yesterday");
  return new Date(ts).toLocaleDateString(LOC[lang], { month: "short", day: "numeric", weekday: "short" });
}
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2400); }

// ===== AI =====
function processPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const draw = (max, q) => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q);
      };
      const out = { full: draw(1024, 0.82), thumb: draw(220, 0.6) };
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
async function callAI(payload) {
  const res = await fetch("/api/ai", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ lang }, payload)) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
  return j;
}
const b64 = u => u.split(",")[1];
const errHtml = (err, act) => '<div class="errbox">' + esc(t("ai_fail")) + '<div class="errdetail">' + esc(String(err).slice(0, 240)) + "</div></div>" +
  (act ? '<button class="btn sec full" data-act="' + act + '" style="margin:0 0 10px">' + esc(t("retry")) + "</button>" : "");

// ===== WALLET =====
function walletLeft() {
  if (!wallet) return null;
  const added = (wallet.adds || []).reduce((s, x) => s + x.a, 0);
  const spent = exps.filter(e => e.method === "cash" && e.currency === "THB" && e.ts >= wallet.ts).reduce((s, e) => s + e.amount, 0);
  return { left: wallet.base + added - spent, spent };
}
function renderWallet() {
  const w = walletLeft();
  $("vWallet").textContent = w ? money(w.left, "THB") : "-";
  $("wSub").textContent = w ? t("wallet_since", { d: new Date(wallet.ts).toLocaleDateString(LOC[lang], { month: "short", day: "numeric" }), a: money(w.spent, "THB") }) : t("wallet_unset");
  $("walletCard").classList.toggle("low", !!w && w.left < 0);
}
$("btnWallet").onclick = () => { const w = walletLeft(); $("inWallet").value = w ? Math.max(0, Math.round(w.left)) : ""; $("sheetWallet").classList.add("open"); setTimeout(() => $("inWallet").focus(), 50); };
$("btnWalletSave").onclick = () => {
  const v = Number($("inWallet").value);
  if (!(v >= 0) || $("inWallet").value === "") { $("inWallet").focus(); return; }
  wallet = { base: Math.round(v * 100) / 100, ts: Date.now(), adds: [] }; lsSet("pc_wallet", wallet);
  $("sheetWallet").classList.remove("open"); renderAll(); toast(t("saved"));
};
$("btnWalletAdd").onclick = () => {
  const v = Number($("inWallet").value);
  if (!(v > 0)) { $("inWallet").focus(); return; }
  if (!wallet) wallet = { base: 0, ts: Date.now(), adds: [] };
  wallet.adds = (wallet.adds || []).concat([{ a: Math.round(v * 100) / 100, ts: Date.now() }]); lsSet("pc_wallet", wallet);
  $("sheetWallet").classList.remove("open"); renderAll(); toast(t("wallet_added", { a: money(v, "THB") }));
};

// ===== TOTALS AND LIST =====
function renderStats() {
  const ms = monthStart(), ds = startOfDay(Date.now());
  const thb = exps.filter(e => e.currency === "THB");
  $("vToday").textContent = money(thb.filter(e => e.ts >= ds).reduce((s, e) => s + e.amount, 0), "THB");
  $("vMonth").textContent = money(thb.filter(e => e.ts >= ms).reduce((s, e) => s + e.amount, 0), "THB");
}
function renderExps() {
  const box = $("expList");
  if (!exps.length) { box.innerHTML = '<div class="empty"><b>' + esc(t("empty_exp")) + "</b>" + esc(t("empty_exp_hint")) + "</div>"; return; }
  let html = "", last = null;
  exps.slice().sort((a, b) => b.ts - a.ts).slice(0, 300).forEach(e => {
    const d = startOfDay(e.ts);
    if (d !== last) { html += '<p class="day">' + esc(dayLabel(e.ts)) + "</p>"; last = d; }
    html += '<div class="row" data-id="' + esc(e.id) + '">' + catDot(e.category) +
      '<div class="main"><p class="t">' + esc(e.merchant || t("c_" + e.category)) + '</p><p class="s">' + esc(t("c_" + e.category)) +
      (e.method !== "cash" ? '<span class="tag ' + esc(e.method) + '">' + esc(t("m_" + e.method)) + "</span>" : "") + (e.note ? " · " + esc(e.note) : "") + "</p>" + srcLine(e.by) + "</div>" +
      '<div class="amt">' + esc(money(e.amount, e.currency)) + "</div></div>";
  });
  box.innerHTML = html;
}
$("expList").addEventListener("click", ev => { const r = ev.target.closest(".row"); if (r) openExp({ editId: r.dataset.id }); });

// ===== QUICK ADD (type or speak) =====
let qd = null;
$("quickForm").addEventListener("submit", e => { e.preventDefault(); const v = $("quickIn").value.trim(); if (v) quickParse(v); });
async function quickParse(text) {
  qd = { text, step: "loading", entries: [], err: "", by: "" };
  $("sheetQuick").classList.add("open"); renderQuick();
  const mine = qd;
  try {
    const r = await callAI({ mode: "quick", text });
    if (qd !== mine) return;
    qd.entries = (r.entries || []).map(x => Object.assign({ on: true }, x)); qd.by = r.by || "";
  } catch (e) { if (qd !== mine) return; qd.err = String(e.message || e); }
  qd.step = "form"; renderQuick();
}
function renderQuick() {
  const d = qd; if (!d) return;
  let h = '<div class="hd"><h3>' + esc(t("quick_title")) + '</h3><button class="btn sec" data-act="close">' + esc(t("cancel")) + "</button></div>" +
    '<p class="muted" style="margin-top:0">“' + esc(d.text) + "”</p>";
  if (d.step === "loading") { $("quickBody").innerHTML = h + '<div class="spin"><i></i>' + esc(t("reading")) + "</div>"; return; }
  if (d.err) h += errHtml(d.err, "retry");
  else if (!d.entries.length) h += '<div class="errbox">' + esc(t("quick_none")) + "</div>";
  d.entries.forEach((x, i) => {
    h += '<div class="qe" data-i="' + i + '"><input type="checkbox" data-f="on"' + (x.on ? " checked" : "") + '>' +
      '<div class="nm"><input data-f="item" value="' + esc(x.item) + '"><div class="meta"><select data-f="category">' + catOptions(x.category) + '</select><select data-f="method">' + methodOptions(x.method) + "</select></div></div>" +
      '<input class="am" data-f="amount" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(x.amount) + '"></div>';
  });
  const n = d.entries.filter(x => x.on && Number(x.amount) > 0).length;
  if (d.entries.length) h += byLine(d.by) + '<button class="btn full" data-act="saveall"' + (n ? "" : " disabled") + ">" + esc(t("save_all", { n })) + "</button>";
  $("quickBody").innerHTML = h;
}
$("quickBody").addEventListener("input", e => {
  const row = e.target.closest(".qe"); if (!row || !qd) return;
  const x = qd.entries[Number(row.dataset.i)], f = e.target.dataset.f;
  if (f === "on") x.on = e.target.checked; else x[f] = e.target.value;
  const n = qd.entries.filter(y => y.on && Number(y.amount) > 0).length, b = $("quickBody").querySelector('[data-act="saveall"]');
  if (b) { b.disabled = !n; b.textContent = t("save_all", { n }); }
});
$("quickBody").addEventListener("change", e => { if (e.target.tagName === "SELECT" || e.target.type === "checkbox") e.target.dispatchEvent(new Event("input", { bubbles: true })); });
$("quickBody").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || !qd) return;
  if (b.dataset.act === "close") { closeQuick(); return; }
  if (b.dataset.act === "retry") { quickParse(qd.text); return; }
  if (b.dataset.act === "saveall") {
    const now = Date.now();
    const add = qd.entries.filter(x => x.on && Number(x.amount) > 0).map((x, i) => ({ id: uid(), ts: now + i, amount: Math.round(Number(x.amount) * 100) / 100, currency: "THB", merchant: String(x.item || "").trim(), category: CATS.includes(x.category) ? x.category : "other", method: METHODS.includes(x.method) ? x.method : "cash", note: "", items: [], thumb: "", by: qd.by }));
    exps = exps.concat(add); saveExps(); $("quickIn").value = ""; closeQuick(); renderAll(); toast(t("saved_n", { n: add.length }));
  }
});
function closeQuick() { $("sheetQuick").classList.remove("open"); qd = null; }

// voice input (Chrome on Android supports this; otherwise the keyboard microphone still works)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) $("btnMic").hidden = false;
$("btnMic").onclick = () => {
  if (!SR) { toast(t("mic_no")); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = SPEECH[lang]; rec.interimResults = true; rec.maxAlternatives = 1;
  const base = $("quickIn").value ? $("quickIn").value + " " : "";
  rec.onresult = ev => { let s = ""; for (let i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript; $("quickIn").value = base + s; };
  rec.onerror = () => toast(t("mic_no"));
  rec.onend = () => { $("btnMic").classList.remove("rec"); rec = null; const v = $("quickIn").value.trim(); if (v && v !== base.trim()) quickParse(v); };
  $("btnMic").classList.add("rec"); try { rec.start(); } catch (e) { rec = null; $("btnMic").classList.remove("rec"); toast(t("mic_no")); }
};

// ===== RECEIPT / MANUAL / EDIT =====
let ed = null;
function openExp(opts) {
  opts = opts || {};
  if (opts.editId) {
    const e = exps.find(x => x.id === opts.editId); if (!e) return;
    ed = { editId: e.id, amount: e.amount, currency: e.currency, merchant: e.merchant, category: e.category, method: e.method || "cash", ts: e.ts, note: e.note || "", thumb: e.thumb || "", full: "", items: e.items || [], aiNote: "", err: "", by: e.by || "", wishId: e.wishId || "", step: "form" };
  } else ed = Object.assign({ amount: "", currency: "THB", merchant: "", category: "food", method: "cash", ts: Date.now(), note: "", thumb: "", full: "", items: [], aiNote: "", err: "", by: "", step: "form" }, opts.prefill || {});
  $("sheetExp").classList.add("open"); renderExp();
}
function closeExp() { $("sheetExp").classList.remove("open"); ed = null; }
async function expFromPhoto(file) {
  openExp();
  try { const p = await processPhoto(file); ed.thumb = p.thumb; ed.full = p.full; } catch (e) { ed.err = "Could not open this photo."; renderExp(); return; }
  scanReceipt();
}
async function scanReceipt() {
  if (!ed || !ed.full) return;
  ed.step = "loading"; ed.err = ""; renderExp();
  const mine = ed;
  try {
    const r = await callAI({ mode: "receipt", image: b64(mine.full) });
    if (ed !== mine) return;
    ed.items = r.items || []; ed.aiNote = r.readable ? (r.note || "") : t("unreadable");
    if (r.readable) { ed.amount = r.amount; ed.currency = r.currency || "THB"; }
    if (r.merchant) ed.merchant = r.merchant;
    ed.category = r.category || ed.category; ed.method = r.method || ed.method; ed.scanned = true; ed.by = r.by || "";
  } catch (e) { if (ed !== mine) return; ed.err = String(e.message || e); }
  ed.step = "form"; renderExp();
}
function renderExp() {
  const d = ed; if (!d) return;
  let h = '<div class="hd"><h3>' + esc(t(d.editId ? "edit_exp" : "new_exp")) + '</h3><button class="btn sec" data-act="close">' + esc(t("cancel")) + "</button></div>";
  if (d.full || d.thumb) h += '<img class="prev" alt="" src="' + esc(d.full || d.thumb) + '">';
  if (d.step === "loading") { $("expBody").innerHTML = h + '<div class="spin"><i></i>' + esc(t("reading")) + "</div>"; return; }
  if (d.err) h += errHtml(d.err, d.full ? "rescan" : "");
  if (d.scanned) h += '<div class="ai"><b>' + esc(t("ai_items")) + "</b>" + (d.items.length ? "<ul>" + d.items.map(x => "<li>" + esc(x.name) + (x.price ? " · " + esc(money(x.price, d.currency)) : "") + "</li>").join("") + "</ul>" : "") + '<div style="margin-top:6px">' + esc(d.aiNote || t("ai_check")) + "</div>" + byLine(d.by) + "</div>";
  else if (d.editId && showSrc) h += '<p class="src" style="margin:0 0 10px">' + esc(d.by ? "AI: " + d.by : t("manual")) + "</p>";
  h += '<div class="two"><div class="fld"><label>' + esc(t("amount")) + " (" + esc(d.currency) + ')</label><input id="eAmt" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(d.amount) + '"></div>' +
    '<div class="fld"><label>' + esc(t("category")) + '</label><select id="eCat">' + catOptions(d.category) + "</select></div></div>" +
    '<div class="fld"><label>' + esc(t("merchant")) + '</label><input id="eMer" maxlength="60" placeholder="' + esc(t("merchant_ph")) + '" value="' + esc(d.merchant) + '"></div>' +
    '<p class="lbl">' + esc(t("method")) + '</p><div class="seg" style="margin-bottom:10px">' + METHODS.map(m => '<button data-m="' + m + '" class="' + (d.method === m ? "on" : "") + '">' + esc(t("m_" + m)) + "</button>").join("") + "</div>" +
    '<div class="two"><div class="fld"><label>' + esc(t("date")) + '</label><input id="eDate" type="date" value="' + esc(toDateInput(d.ts)) + '"></div>' +
    '<div class="fld"><label>' + esc(t("note")) + '</label><input id="eNote" maxlength="80" value="' + esc(d.note) + '"></div></div>' +
    '<button class="btn full" data-act="save">' + esc(t("save")) + "</button>" + (d.editId ? '<button class="btn warn full" data-act="del">' + esc(t("delete")) + "</button>" : "");
  $("expBody").innerHTML = h;
}
$("expBody").addEventListener("input", e => {
  if (!ed) return; const id = e.target.id, v = e.target.value;
  if (id === "eAmt") ed.amount = v; if (id === "eCat") ed.category = v; if (id === "eMer") ed.merchant = v;
  if (id === "eDate") ed.ts = fromDateInput(v, ed.ts); if (id === "eNote") ed.note = v;
});
$("expBody").addEventListener("click", e => {
  if (!ed) return;
  const mb = e.target.closest("[data-m]"); if (mb) { ed.method = mb.dataset.m; renderExp(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "close") closeExp();
  if (a === "rescan") scanReceipt();
  if (a === "save") saveExp();
  if (a === "del" && confirm(t("confirm_delete"))) { exps = exps.filter(x => x.id !== ed.editId); saveExps(); closeExp(); renderAll(); }
});
function saveExp() {
  const amt = Math.round(Number(ed.amount) * 100) / 100;
  if (!(amt > 0)) { $("eAmt") && $("eAmt").focus(); return; }
  const rec = { id: ed.editId || uid(), ts: ed.ts, amount: amt, currency: ed.currency || "THB", merchant: String(ed.merchant || "").trim(), category: CATS.includes(ed.category) ? ed.category : "other", method: METHODS.includes(ed.method) ? ed.method : "cash", note: String(ed.note || "").trim(), items: ed.items || [], thumb: ed.thumb || "", by: ed.by || "", wishId: ed.wishId || "" };
  if (ed.editId) exps = exps.map(x => x.id === ed.editId ? rec : x); else exps.push(rec);
  if (!saveExps()) { rec.thumb = ""; saveExps(); }
  closeExp(); renderAll(); toast(t("saved"));
}
function onFile(input, fn) { input.addEventListener("change", e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) fn(f); }); }
onFile($("fCam"), expFromPhoto); onFile($("fGal"), expFromPhoto);
$("btnManual").onclick = () => openExp();

// ===== HOURS OF WORK =====
function hoursText(price) {
  if (!(wage > 0) || !(price > 0)) return "";
  const h = price / wage;
  const v = h < 1 ? t("mins", { n: Math.max(1, Math.round(h * 60)) }) : t("hrs", { n: h < 10 ? Math.round(h * 10) / 10 : Math.round(h) });
  return t("hours_work", { h: v });
}
function setWage(v) { wage = v > 0 ? Math.round(v * 100) / 100 : 0; lsSet("pc_wage", wage); renderAll(); if (wd) renderWish(); if (ed) renderExp(); }
$("wageTile").onclick = () => { $("inWage").value = wage || ""; $("sheetWage").classList.add("open"); setTimeout(() => $("inWage").focus(), 50); };
$("btnWageSave").onclick = () => { setWage(Number($("inWage").value)); $("sheetWage").classList.remove("open"); toast(t("saved")); };
$("setWage").addEventListener("input", e => setWage(Number(e.target.value)));

// ===== WANT LIST =====
const isReady = w => w.status === "wait" && Date.now() >= w.until;
function leftText(w) {
  const ms = w.until - Date.now();
  return ms >= 3600000 ? t("left_h", { n: Math.ceil(ms / 3600000) }) : t("left_m", { n: Math.max(1, Math.ceil(ms / 60000)) });
}
const shortDate = ts => new Date(ts).toLocaleDateString(LOC[lang], { month: "short", day: "numeric" });
function wishCard(w) {
  const ready = isReady(w), done = w.status !== "wait";
  let status;
  if (ready) status = '<p class="s go">' + esc(t("ready")) + "</p>";
  else if (done) status = '<p class="s">' + esc(t(w.status === "bought" ? "bought_on" : "skipped_on", { d: shortDate(w.decidedTs) })) + "</p>";
  else status = '<p class="s">' + esc(leftText(w)) + '</p><div class="bar"><i style="width:' + Math.min(100, Math.round((Date.now() - w.ts) / (w.until - w.ts) * 100)) + '%"></i></div>';
  const hrs = hoursText(w.price);
  return '<div class="wcard' + (ready ? " ready" : "") + (done ? " done" : "") + '" data-wid="' + esc(w.id) + '">' +
    (w.thumb ? '<img class="wthumb" alt="" src="' + esc(w.thumb) + '">' : '<div class="wthumb">' + esc((w.item || "?").slice(0, 1)) + "</div>") +
    '<div class="main"><p class="t">' + esc(w.item || t("c_" + w.category)) + '</p><p class="p">' + esc(money(w.price, w.currency)) + (hrs ? ' <span class="hrs">' + esc(hrs) + "</span>" : "") + "</p>" + status + "</div></div>";
}
function renderWant() {
  const skipped = wishes.filter(w => w.status === "skipped" && w.currency === "THB");
  $("vSaved").textContent = money(skipped.reduce((s, w) => s + w.price, 0), "THB");
  $("savedSub").textContent = skipped.length ? t("saved_sub", { n: skipped.length }) : t("saved_none");
  const waiting = wishes.filter(w => w.status === "wait");
  $("vWaiting").textContent = String(waiting.length);
  $("vWage").textContent = wage > 0 ? money(wage, "THB") : t("wage_unset");
  const ready = waiting.filter(isReady);
  $("wantBadge").hidden = !ready.length; $("wantBadge").textContent = ready.length;
  if (!wishes.length) { $("wishList").innerHTML = '<div class="empty"><b>' + esc(t("wish_empty")) + "</b>" + esc(t("wish_empty_hint")) + "</div>"; return; }
  const sec = (k, list) => list.length ? '<p class="day">' + esc(t(k)) + "</p>" + list.map(wishCard).join("") : "";
  $("wishList").innerHTML = sec("sec_ready", ready.sort((a, b) => a.until - b.until)) +
    sec("sec_wait", waiting.filter(w => !isReady(w)).sort((a, b) => a.until - b.until)) +
    sec("sec_done", wishes.filter(w => w.status !== "wait").sort((a, b) => b.decidedTs - a.decidedTs).slice(0, 30));
}
$("wishList").addEventListener("click", e => { const c = e.target.closest("[data-wid]"); if (c) openWish({ id: c.dataset.wid }); });

let wd = null;
function openWish(opts) {
  opts = opts || {};
  if (opts.id) { const w = wishes.find(x => x.id === opts.id); if (!w) return; wd = { view: w.id }; }
  else wd = { item: "", price: "", currency: "THB", store: "", category: "shopping", questions: [], tip: "", thumb: "", full: "", days: 1, step: "form", err: "", by: "" };
  $("sheetWish").classList.add("open"); renderWish();
}
function closeWish() { $("sheetWish").classList.remove("open"); wd = null; }
async function wishFromPhoto(file) {
  openWish();
  try { const p = await processPhoto(file); wd.thumb = p.thumb; wd.full = p.full; } catch (e) { wd.err = "Could not open this photo."; renderWish(); return; }
  askWish();
}
async function askWish() {
  if (!wd) return;
  const text = wd.full ? "" : [wd.item, wd.price ? wd.price + " " + wd.currency : "", wd.store].filter(Boolean).join(", ");
  if (!wd.full && !text) { toast(t("need_item")); return; }
  wd.step = "loading"; wd.err = ""; renderWish();
  const mine = wd;
  try {
    const r = await callAI(Object.assign({ mode: "wish" }, wd.full ? { image: b64(wd.full) } : { text }));
    if (wd !== mine) return;
    if (r.item && !wd.item) wd.item = r.item;
    if (r.price && !Number(wd.price)) { wd.price = r.price; wd.currency = r.currency || "THB"; }
    if (r.store && !wd.store) wd.store = r.store;
    wd.category = r.category || wd.category; wd.questions = r.questions || []; wd.tip = r.tip || ""; wd.by = r.by || "";
  } catch (e) { if (wd !== mine) return; wd.err = String(e.message || e); }
  wd.step = "form"; renderWish();
}
function qBox(questions, tip, by) {
  if (!questions.length && !tip) return "";
  return '<div class="ai"><b>' + esc(t("ask_yourself")) + '</b><ol class="qs">' + questions.map(q => "<li>" + esc(q) + "</li>").join("") + "</ol>" + (tip ? '<div style="margin-top:6px">' + esc(tip) + "</div>" : "") + byLine(by) + "</div>";
}
function renderWish() {
  const d = wd; if (!d) return;
  if (d.view) {
    const w = wishes.find(x => x.id === d.view); if (!w) { closeWish(); return; }
    const ready = isReady(w), hrs = hoursText(w.price);
    let h = '<div class="hd"><h3>' + esc(t("wish_detail")) + '</h3><button class="btn sec" data-act="close">' + esc(t("close")) + "</button></div>" +
      (w.thumb ? '<img class="prev" alt="" src="' + esc(w.thumb) + '">' : "") +
      '<h3 style="margin:0 0 2px">' + esc(w.item || t("c_" + w.category)) + "</h3>" +
      '<p style="margin:0 0 6px;font-size:22px;font-weight:700">' + esc(money(w.price, w.currency)) + "</p>" +
      (hrs ? '<p class="hrsbig">' + esc(hrs) + "</p>" : "") +
      (w.store ? '<p class="muted" style="margin:0 0 10px">' + esc(w.store) + "</p>" : "") + qBox(w.questions || [], w.tip, w.by);
    if (ready) h += '<p style="font-weight:700;color:var(--gold)">' + esc(t("ready")) + '</p><div class="two"><button class="btn gold" data-act="skip">' + esc(t("skip_it")) + '</button><button class="btn sec" data-act="buy">' + esc(t("still_want")) + "</button></div>";
    else if (w.status === "wait") h += '<p class="muted">' + esc(leftText(w)) + '</p><button class="btn gold full" data-act="skip">' + esc(t("skip_now")) + "</button>";
    else h += '<p class="muted">' + esc(t(w.status === "bought" ? "bought_on" : "skipped_on", { d: shortDate(w.decidedTs) })) + "</p>";
    h += '<button class="btn warn full" data-act="wdel">' + esc(t("delete")) + "</button>";
    $("wishBody").innerHTML = h; return;
  }
  let h = '<div class="hd"><h3>' + esc(t("new_wish")) + '</h3><button class="btn sec" data-act="close">' + esc(t("cancel")) + "</button></div>";
  if (d.full || d.thumb) h += '<img class="prev" alt="" src="' + esc(d.full || d.thumb) + '">';
  if (d.step === "loading") { $("wishBody").innerHTML = h + '<div class="spin"><i></i>' + esc(t("reading")) + "</div>"; return; }
  if (d.err) h += '<div class="errbox">' + esc(t("busy_wish")) + '<div class="errdetail">' + esc(d.err.slice(0, 240)) + "</div></div>";
  h += qBox(d.questions, d.tip, d.by);
  const hrs = hoursText(Number(d.price));
  h += '<div class="fld"><label>' + esc(t("item")) + '</label><input id="wItem" maxlength="80" placeholder="' + esc(t("item_ph")) + '" value="' + esc(d.item) + '"></div>' +
    '<div class="two"><div class="fld"><label>' + esc(t("price")) + " (" + esc(d.currency) + ')</label><input id="wPrice" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(d.price) + '"></div>' +
    '<div class="fld"><label>' + esc(t("store")) + '</label><input id="wStore" maxlength="40" value="' + esc(d.store) + '"></div></div>' +
    '<p class="hrsbig" id="wHrs">' + esc(hrs) + "</p>" +
    (!d.questions.length && !d.full ? '<button class="btn sec full" data-act="ask" style="margin:0 0 10px">' + esc(t("ask_q")) + "</button>" : "") +
    (d.err && d.full ? '<button class="btn sec full" data-act="ask" style="margin:0 0 10px">' + esc(t("retry")) + "</button>" : "") +
    '<p class="lbl">' + esc(t("wait_for")) + '</p><div class="seg" style="margin-bottom:10px">' + [1, 2, 3].map(n => '<button data-days="' + n + '" class="' + (d.days === n ? "on" : "") + '">' + esc(t("d" + n)) + "</button>").join("") + "</div>" +
    '<button class="btn gold full" data-act="start">' + esc(t("start_pause")) + "</button>";
  $("wishBody").innerHTML = h;
}
$("wishBody").addEventListener("input", e => {
  if (!wd || wd.view) return; const id = e.target.id, v = e.target.value;
  if (id === "wItem") wd.item = v; if (id === "wStore") wd.store = v;
  if (id === "wPrice") { wd.price = v; const el = $("wHrs"); if (el) el.textContent = hoursText(Number(v)); }
});
$("wishBody").addEventListener("click", e => {
  if (!wd) return;
  const db = e.target.closest("[data-days]"); if (db) { wd.days = Number(db.dataset.days); renderWish(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "close") { closeWish(); return; }
  if (a === "ask") { askWish(); return; }
  if (a === "start") {
    const price = Math.round(Number(wd.price) * 100) / 100;
    if (!wd.item.trim() && !(price > 0)) { toast(t("need_item")); return; }
    const now = Date.now();
    wishes.push({ id: uid(), ts: now, until: now + wd.days * DAY, item: wd.item.trim(), price: price > 0 ? price : 0, currency: wd.currency || "THB", store: wd.store.trim(), category: wd.category, questions: wd.questions, tip: wd.tip, thumb: wd.thumb, status: "wait", decidedTs: 0, by: wd.by });
    if (!saveWishes()) { wishes[wishes.length - 1].thumb = ""; saveWishes(); }
    closeWish(); renderAll(); toast(t("saved")); return;
  }
  const w = wishes.find(x => x.id === wd.view); if (!w) return;
  if (a === "skip") { w.status = "skipped"; w.decidedTs = Date.now(); saveWishes(); closeWish(); renderAll(); toast(t("skipped_toast", { a: money(w.price, w.currency) })); }
  if (a === "buy") {
    w.status = "bought"; w.decidedTs = Date.now(); saveWishes(); closeWish(); renderAll(); showTab("Spend");
    openExp({ prefill: { amount: w.price || "", currency: w.currency, merchant: w.item, category: w.category, method: "transfer", wishId: w.id, thumb: w.thumb } });
    toast(t("bought_toast"));
  }
  if (a === "wdel" && confirm(t("confirm_delete"))) { wishes = wishes.filter(x => x.id !== w.id); saveWishes(); closeWish(); renderAll(); }
});
onFile($("fWish"), wishFromPhoto);
$("btnWishManual").onclick = () => openWish();

// ===== TABS =====
function showTab(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view" + name));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  lsSet("pc_tab", name); try { window.scrollTo(0, 0); } catch (e) {}
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
setInterval(() => { if (!document.hidden) renderWant(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderWant(); });

// ===== SETTINGS =====
$("btnSettings").onclick = () => $("sheetSet").classList.add("open");
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => $(b.dataset.close).classList.remove("open")));
document.querySelectorAll(".ov").forEach(o => o.addEventListener("click", e => { if (e.target === o) { o.classList.remove("open"); if (o.id === "sheetExp") ed = null; if (o.id === "sheetQuick") qd = null; if (o.id === "sheetWish") wd = null; } }));
$("selLang").onchange = e => { lang = e.target.value; lsSet("pc_lang", lang); applyLang(); };
$("themeSw").addEventListener("click", e => { const b = e.target.closest("[data-th]"); if (!b) return; theme = b.dataset.th; lsSet("pc_theme", theme); applyTheme(); });
$("chkSrc").onchange = e => { showSrc = e.target.checked; lsSet("pc_showsrc", showSrc); renderAll(); };
$("btnClear").onclick = () => { if (!confirm(t("confirm_clear"))) return; exps = []; wallet = null; wishes = []; saveExps(); saveWishes(); lsSet("pc_wallet", null); $("sheetSet").classList.remove("open"); renderAll(); };
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  $("themeSw").innerHTML = Object.keys(THEMES).map(k => '<button data-th="' + k + '" class="' + (k === theme ? "on" : "") + '"><i style="background:' + THEMES[k] + '"></i>' + esc(t("th_" + k)) + "</button>").join("");
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#1f6f54";
}
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("quickIn").placeholder = t("quick_ph");
  $("selLang").innerHTML = Object.keys(LANGS).map(k => '<option value="' + k + '"' + (k === lang ? " selected" : "") + ">" + LANGS[k] + "</option>").join("");
  $("verLbl").textContent = t("version", { v: VERSION });
  $("chkSrc").checked = showSrc;
  applyTheme(); renderAll();
  $("setWage").value = wage || "";
  if (ed) renderExp(); if (qd) renderQuick(); if (wd) renderWish();
}
function renderAll() { renderWallet(); renderStats(); renderExps(); renderWant(); }

// ===== START =====
applyLang();
showTab(lsGet("pc_tab", "Spend") === "Want" ? "Want" : "Spend");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
