<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1c">
<title>Pocket Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#1f2a24;--mute:#6b736c;--line:#e4ddcd;--brand:#1f6f54;--brand-ink:#fff;--soft:#e3efe8;--warn:#b4532a;--warn-soft:#f8e6dc;--gold:#c58a1a;--gold-soft:#f7ecd2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1d231f;--ink:#e9ece7;--mute:#9aa39c;--line:#2e3631;--brand:#4fb58b;--brand-ink:#0f1612;--soft:#20352b;--warn:#f08b62;--warn-soft:#3a2219;--gold:#e5b34f;--gold-soft:#3a2f17}}
:root[data-theme="dark"]{--bg:#141815;--card:#1d231f;--ink:#e9ece7;--mute:#9aa39c;--line:#2e3631;--brand:#4fb58b;--brand-ink:#0f1612;--soft:#20352b;--warn:#f08b62;--warn-soft:#3a2219;--gold:#e5b34f;--gold-soft:#3a2f17}
:root[data-theme="flow"]{--bg:#0b0d1c;--card:#161a33;--ink:#eef0ff;--mute:#9ba2cc;--line:#283058;--brand:#6d7bff;--brand-ink:#fff;--soft:#222a57;--warn:#ff7d8a;--warn-soft:#3a1d2c;--gold:#c79bff;--gold-soft:#2a2150;--wallet:linear-gradient(135deg,#2f54ff,#8b3dff);--bgimg:radial-gradient(900px 500px at 100% -10%,rgba(139,61,255,.35),transparent 60%),radial-gradient(700px 500px at -20% 10%,rgba(47,84,255,.28),transparent 60%)}
:root[data-theme="purple"]{--bg:#1a1326;--card:#241b35;--ink:#efe8f8;--mute:#a99cbf;--line:#3a2d52;--brand:#b18cff;--brand-ink:#1a1326;--soft:#32264a;--warn:#ff8f7a;--warn-soft:#3d2125;--gold:#f0c46a;--gold-soft:#3a2e1c}
:root[data-theme="cream"]{--bg:#f8efd9;--card:#fffaee;--ink:#3a2f22;--mute:#857762;--line:#eadcbc;--brand:#a0672a;--brand-ink:#fff;--soft:#f1e3c3;--warn:#b4532a;--warn-soft:#f6e0d2;--gold:#c58a1a;--gold-soft:#f3e2b6}
:root[data-theme="olive"]{--bg:#eceee0;--card:#f8f9f1;--ink:#2b3020;--mute:#6f765f;--line:#d9ddc6;--brand:#5b6a36;--brand-ink:#fff;--soft:#dfe4cc;--warn:#a8532e;--warn-soft:#f1dfd3;--gold:#a8862a;--gold-soft:#ece3c3}
:root[data-theme="rose"]{--bg:#f7e8eb;--card:#fff7f8;--ink:#3b2529;--mute:#8a6d73;--line:#ecd3d8;--brand:#b0496a;--brand-ink:#fff;--soft:#f2d8de;--warn:#b4532a;--warn-soft:#f6e0d2;--gold:#b77b2b;--gold-soft:#f3e4cd}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:contain;margin:0;background:var(--bg);background-image:var(--bgimg,none);background-attachment:fixed;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans Thai",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--mute);font-size:14px}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wallet{margin:16px 0 10px;background:var(--wallet,var(--brand));color:var(--brand-ink);border-radius:22px;padding:14px 18px 12px}
.whead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.wrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;cursor:pointer;border-top:1px solid rgba(255,255,255,.16)}
.wrow:first-child{border-top:0}
.wrow .amt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.wrow .meta{font-size:12px;opacity:.85;text-align:end}
.wrow.low .amt{color:#ffd0c4}
.wallet .k{font-size:13px;opacity:.85}
.wallet .v{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.wallet .s{font-size:13px;opacity:.85;margin-top:2px}
.wallet button{border:0;border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.18);color:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.wallet.low{background:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--mute)}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:10px}
.quick input{flex:1;min-width:0;border:0;background:transparent;padding:10px;outline:none}
.qbtn{border:0;border-radius:12px;width:44px;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--soft);color:var(--ink)}
.qbtn.go{background:var(--brand);color:var(--brand-ink)}
.qbtn.rec{background:var(--warn);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;text-decoration:none}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.gold{background:var(--gold);color:#fff}
.btn.full{width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.acts .btn{flex:1 1 120px}
.day{font-size:12px;color:var(--mute);margin:14px 4px 6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.row .main{flex:1;min-width:0}
.row .t{margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{margin:0;font-size:13px;color:var(--mute)}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--soft);margin-inline-start:4px;vertical-align:1px}
.tag.transfer{background:#dfe8f6;color:#2f5f9e}.tag.card{background:#eee3f3;color:#7a4a92}
.src{margin:2px 0 0;font-size:11px;color:var(--mute);opacity:.8}
.empty{text-align:center;color:var(--mute);padding:28px 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.muted{color:var(--mute);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.hd h3{margin:0;font-size:20px}
.fld{margin-bottom:10px}
.fld label,.lbl{display:block;font-size:12px;color:var(--mute);margin:0 0 3px}
.fld input,.fld select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:var(--soft);margin-bottom:10px}
.spin{display:flex;align-items:center;gap:10px;padding:16px 4px;color:var(--mute)}
.spin i{width:18px;height:18px;border:3px solid var(--soft);border-top-color:var(--brand);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.errbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.errdetail{margin-top:6px;font-size:11px;opacity:.65;word-break:break-word}
.ai{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.ai ul{margin:6px 0 0;padding-inline-start:18px}
.byline{margin-top:8px;font-size:12px;font-weight:600;color:var(--brand)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.qe{display:grid;grid-template-columns:auto 1fr 90px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qe input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.qe .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.qe .nm input,.qe .nm select,.qe .am{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.qe .meta{display:flex;gap:6px}
.qe .meta select{flex:1;font-size:13px;padding:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:186px;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--brand)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.view{display:none}.view.on{display:block}
.savedtile{margin:16px 0 10px;background:var(--gold-soft);border-radius:22px;padding:16px 18px;color:var(--ink)}
.savedtile .k{font-size:13px;color:var(--mute)}
.savedtile .v{font-size:32px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.15}
.savedtile .s{font-size:13px;color:var(--mute);margin-top:2px}
.stat.click{cursor:pointer}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;cursor:pointer}
.wcard.ready{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.wcard.done{opacity:.6}
.wthumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--mute);font-size:24px;font-weight:700}
.wcard .main{flex:1;min-width:0}
.wcard .t{margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .p{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.wcard .hrs{font-weight:500;color:var(--mute);font-size:13px}
.wcard .s{margin:4px 0 0;font-size:13px;color:var(--mute)}
.wcard .s.go{color:var(--gold);font-weight:600}
.bar{height:5px;border-radius:99px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.qs{margin:6px 0 0;padding-inline-start:20px}.qs li{margin-bottom:4px}
.hrsbig{font-size:14px;color:var(--mute);margin:-4px 0 10px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 16px;padding:3px}
.sw button{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 1px var(--line);transition:transform .2s,box-shadow .2s}
.sw button:hover{transform:scale(1.08)}
.sw button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand);transform:scale(1.05)}
.sw i{display:block;width:100%;height:100%;border-radius:50%}
.themefade,.themefade *{transition:background-color .5s ease,color .5s ease,border-color .5s ease,box-shadow .5s ease!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.55s;animation-timing-function:ease}
.wallet .s2{font-size:13px;opacity:.95;margin-top:6px;font-weight:600}
.wl{cursor:pointer;padding:2px 0}.wl.miss{background:rgba(255,255,255,.18);border-radius:8px;padding:4px 8px;margin-top:4px;display:inline-block;font-weight:500}
.goal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.goal .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.goal .bar{height:8px}.goal .bar i{background:var(--gold)}
.regret{background:var(--card);border:2px solid var(--brand);border-radius:16px;padding:12px;margin-bottom:12px}
.regret p{margin:0 0 8px}
.regret .three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.regret .three .btn{padding:10px 4px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h4{margin:0 0 10px;font-size:15px}
.cbar{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;font-size:13px;margin-bottom:7px}
.cbar .tr{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.cbar .tr i{display:block;height:100%;border-radius:99px}
.cbar .n{font-variant-numeric:tabular-nums;font-weight:600}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:4px 0 8px;background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .k{font-size:12px;color:var(--mute)}.kv .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--warn)}.down{color:var(--brand)}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:14px;margin:6px 0 10px}
.qr svg{width:180px;height:180px}
.qr span{color:#333;font-size:12px;word-break:break-all;text-align:center}
.ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-60px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.15);transition:transform .15s}
.ptr i{width:14px;height:14px;border:2px solid var(--soft);border-top-color:var(--brand);border-radius:50%}
.ptr.go i{animation:r 1s linear infinite}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb .rk{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.lb .rk.r1{background:var(--gold);color:#fff}
.lb .nm{flex:1;min-width:0;font-weight:600}.lb .nm small{color:var(--mute);font-weight:400}
.lb .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.code{cursor:pointer;user-select:all;font-family:ui-monospace,Menlo,monospace;letter-spacing:.15em;font-weight:700;background:var(--soft);padding:2px 8px;border-radius:8px}
.brake h5{margin:12px 0 6px;font-size:14px}
.brake ol{margin:0;padding-inline-start:20px;font-size:14px}.brake li{margin-bottom:6px}
.row .t,.wcard .t,.lb .nm{unicode-bidi:plaintext}
[dir="rtl"] .qbtn.go svg{transform:scaleX(-1)}
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:var(--bgimg,none);overflow:auto;display:none}
.onb.open{display:block}
.onb .in{max-width:520px;margin:0 auto;padding:24px 18px 40px;min-height:100%;display:flex;flex-direction:column}
.onb .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.onb .dots{display:flex;gap:6px}.onb .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.onb .dots i.on{background:var(--brand);width:22px;border-radius:99px}
.onb h2{font-size:26px;margin:8px 0 6px;letter-spacing:-.01em}
.onb .lead{color:var(--mute);margin:0 0 18px}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.pick.on{border:2px solid var(--brand);background:var(--soft)}
.pick .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:20px;font-weight:800;color:var(--brand)}
.pick b{display:block}.pick span{color:var(--mute);font-size:13px}
.onb .grow{flex:1}
.linkbtn{background:none;border:0;color:var(--mute);cursor:pointer;font-size:14px;padding:6px}
.plusbox{background:var(--wallet,var(--brand));color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.plusbox h3{margin:0 0 4px;font-size:22px}.plusbox p{margin:0;opacity:.9}
.ftab{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:12px}
.ftab th,.ftab td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
.ftab th:first-child,.ftab td:first-child{text-align:start}
.ftab td.y{color:var(--brand);font-weight:700}.ftab td.n{color:var(--mute)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.price{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--bg)}
.price b{display:block;font-size:22px}.price span{font-size:12px;color:var(--mute)}
.price .tagx{display:inline-block;margin-top:4px;background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border-radius:16px;padding:12px 14px;margin-bottom:12px;cursor:pointer;font-weight:600}
.banner span:last-child{color:var(--gold);font-weight:800}
.cardov{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:rgba(5,6,15,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);perspective:1100px;touch-action:none}
.cardov.open{display:flex}
.tiltwrap{width:min(74vw,330px,calc((100vh - 200px) * .8));transform-style:preserve-3d;transition:transform .18s ease-out}
.cardin{position:relative;border-radius:22px;transform-style:preserve-3d;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);animation:cardIn 1.1s cubic-bezier(.2,.8,.2,1) both,cardSway 6s ease-in-out 1.1s infinite}
.cardin img{display:block;width:100%;border-radius:22px}
.cardin .shine{position:absolute;inset:0;border-radius:22px;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle at var(--sx,30%) var(--sy,20%),rgba(255,255,255,.22),transparent 45%),linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 48%,transparent 60%);background-size:100% 100%,250% 250%;animation:cardShine 2.2s ease-in-out .5s both}
.cardbtns{display:flex;gap:10px}
.cardbtns .btn{min-width:130px}
@keyframes cardIn{0%{opacity:0;transform:translateY(60px) rotateY(-40deg) rotateX(22deg) scale(.75)}60%{opacity:1;transform:rotateY(12deg) rotateX(-5deg) scale(1.03)}100%{transform:rotateY(-6deg) rotateX(3deg)}}
@keyframes cardSway{0%,100%{transform:rotateY(-6deg) rotateX(3deg)}50%{transform:rotateY(6deg) rotateX(-3deg)}}
@keyframes cardShine{0%{background-position:0 0,130% 0}100%{background-position:0 0,-70% 0}}
@media (prefers-reduced-motion:reduce){.cardin,.cardin .shine{animation:none}.tiltwrap{transition:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer;text-align:start}
.tourhole{position:fixed;z-index:60;border-radius:18px;box-shadow:0 0 0 9999px rgba(5,6,15,.72),0 0 0 3px var(--brand);transition:all .3s ease;pointer-events:none}
.tourtip{position:fixed;z-index:61;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:top .3s ease}
.tourtip p{margin:0 0 10px}
.tourtip .row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tourtip .n{color:var(--mute);font-size:13px}
.vsel{flex:none;width:58px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-size:13px;font-weight:700;padding:0 4px;text-align:center}
.qrcard{background:linear-gradient(150deg,#1c2150 0%,#2a1660 60%,#3a1470 100%);color:#eef0ff;padding:22px 20px 18px;text-align:center}
.qrtop{display:flex;align-items:center;gap:12px;text-align:start;margin-bottom:16px}
.qrtop img{width:46px;height:46px;border-radius:12px;flex:none}
.qrtop b{display:block;font-size:18px}.qrtop span{font-size:12px;color:#b9bfe8}
.qrbox{background:#fff;border-radius:18px;padding:14px;width:78%;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.qrbox svg{display:block;width:100%;height:auto}
.qrurl{margin-top:12px;font-weight:700;letter-spacing:.02em;color:#c79bff}
.qrhint{margin:8px 0 0;font-size:12px;line-height:1.45;color:#b9bfe8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:30;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}

function processPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const draw = (max, q) => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q);
      };
      const out = { full: draw(1024, 0.82), thumb: draw(220, 0.6) };
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
async function callAI(payload) {
  const res = await fetch("/api/ai", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ lang }, payload)) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
  if (payload.mode !== "translate") { const m = new Date().toISOString().slice(0, 7), u = lsGet("pc_aiuse", { m, n: 0 }); rawSet("pc_aiuse", { m, n: (u.m === m ? u.n : 0) + 1 }); }
  return j;
}

function walletLeft(cur) {
  const w = wallets[cur]; if (!w || w.removed) return null;
  const added = (w.adds || []).reduce((s, x) => s + x.a, 0);

  return { left: w.base + added - spent, spent, ts: w.ts };
}

// ===== HOURS OF WORK =====
function hoursText(price, cur) {
  if (pmode() === "off") return "";
  if (pmode() === "custom") {
    if (!(custom.price > 0) || !custom.name || !(price > 0)) return "";
    const n = conv(price, cur || mainCur, mainCur) / custom.price;
    return isFinite(n) && n > 0 ? t("custom_x", { x: custom.name, n: n < 10 ? Math.round(n * 10) / 10 : Math.round(n) }) : "";
  }
  if (pmode() === "days") {
    if (!(allow > 0) || !(price > 0)) return "";
    const d = conv(price, cur || mainCur, mainCur) / (allow / 30);
    if (!isFinite(d) || d <= 0) return "";
    return t("days_money", { n: d < 10 ? Math.max(0.1, Math.round(d * 10) / 10) : Math.round(d) });
  }
  if (!(wage > 0) || !(price > 0)) return "";
  const h = conv(price, cur || mainCur, mainCur) / wage;
  if (!isFinite(h) || h <= 0) return "";
  const v = h < 1 ? t("mins", { n: Math.max(1, Math.round(h * 60)) }) : t("hrs", { n: h < 10 ? Math.round(h * 10) / 10 : Math.round(h) });
  return t("hours_work", { h: v });
}
function setWage(v) {
  const n = v > 0 ? Math.round(v * 100) / 100 : 0;
  if (pmode() === "days") { allow = n; lsSet("pc_allow", allow); } else { wage = n; lsSet("pc_wage", wage); }
  renderAll(); if (wd) renderWish(); if (ed) renderExp();
}

  if (code === "invalid_credentials" || m.includes("invalid login") || m.includes("credential")) return t("err_login");
  if (code === "user_already_exists" || m.includes("already registered") || m.includes("already exists")) return t("err_exists");
  if (code === "email_not_confirmed" || m.includes("not confirmed")) return t("err_confirm");
  if (code === "same_password" || m.includes("different from the old")) return t("pw_same");
  if (code === "weak_password" || m.includes("at least") || m.includes("characters")) return t("err_pass");
  if (code === "email_address_invalid" || m.includes("invalid format") || m.includes("email address") || m.includes("validate email")) return t("err_email");
  if (code.includes("rate_limit") || m.includes("rate limit") || m.includes("too many")) return t("err_many");
  if (m.includes("failed to fetch") || m.includes("network")) return t("err_net");
  if (m.includes("sending") || m.includes("smtp") || m.includes("email") && m.includes("send")) return t("err_mail");
  return t("err_other");
}

  if (error) throw error;
  const ids = (mine || []).map(x => x.challenge_id);
  if (!ids.length) { myCh = []; return; }
  const [{ data: chs }, { data: mem }] = await Promise.all([sb.from("challenges").select("*").in("id", ids), sb.from("challenge_members").select("*").in("challenge_id", ids)]);
  myCh = (chs || []).map(c => Object.assign(c, { members: (mem || []).filter(m => m.challenge_id === c.id).sort((a, b) => b.saved - a.saved) })).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}
function myScore(c) {
  const from = new Date(c.created_at).getTime(), to = new Date(c.ends_at).getTime();
  const list = wishes.filter(w => w.status === "skipped" && w.decidedTs >= from && w.decidedTs <= to);
  return { saved: Math.round(list.reduce((s, w) => s + conv(w.price, w.currency || "THB", c.currency), 0)), skipped: list.length };
}
async function pushChallengeScores() {

      const sc = myScore(c);
      const me = c.members.find(m => m.user_id === user.id);
      if (me && (me.saved !== sc.saved || me.skipped !== sc.skipped || (myName && me.display_name !== myName))) {
        await sb.from("challenge_members").update({ saved: sc.saved, skipped: sc.skipped, display_name: myName || me.display_name, updated_at: new Date().toISOString() }).eq("challenge_id", c.id).eq("user_id", user.id);

}

// ===== HOW TO USE: A GUIDED TOUR OF EVERY TAB (replay any time from Settings) =====
const TOUR = [
  { tab: "Spend", el: "walletCard", k: "tour_1" },
  { tab: "Spend", el: "quickForm", k: "tour_2" },
  { tab: "Spend", el: "viewSpend", sel: ".acts", k: "tour_scan" },
  { tab: "Want", el: "viewWant", sel: ".savedtile", k: "tour_3" },
  { tab: "Want", el: "wishList", sel: ".wcard.ready", k: "tour_decide" },
  { tab: "Insight", el: "askForm", k: "tour_4" },
  { tab: "Insight", el: "coach_weekly", k: "tour_coach" },
  { tab: "Friends", el: "frBody", sel: ".card", k: "tour_friends" },
  { settings: true, el: "themeSw", k: "tour_settings" }
];
let tourStep = -1, tourDemo = false;
const tourEl = st => st.sel ? document.querySelector("#" + st.el + " " + st.sel) : $(st.el);
function startTour(withDemo) {
  $("sheetSet").classList.remove("open");
  tourDemo = !!withDemo;
  if (!exps.length && !wishes.length) { loadDemo(); tourDemo = true; }
  tourStep = 0; showTourStep();
}
function hideTour() { $("tourHole").hidden = $("tourTip").hidden = true; }
function endTour() {
  tourStep = -1; lsSet("pc_tour", true); $("sheetSet").classList.remove("open"); showTab("Spend");
  if (tourDemo && hasDemo()) { // ask once whether to keep the sample data
    $("tourHole").hidden = true;
    $("tourTip").innerHTML = "<p>" + esc(t("tour_keep")) + '</p><div class="two"><button class="btn sec" data-tour="drop">' + esc(t("demo_remove")) + '</button><button class="btn" data-tour="keep">' + esc(t("tour_keep_btn")) + "</button></div>";
    $("tourTip").style.top = "35%"; $("tourTip").hidden = false; return;
  }
  hideTour();
}
function placeTour() {
  if (tourStep < 0) return;
  const el = tourEl(TOUR[tourStep]); if (!el) return;
  const r = el.getBoundingClientRect(), pad = 6, hole = $("tourHole"), tip = $("tourTip");
  hole.style.left = (r.left - pad) + "px"; hole.style.top = (r.top - pad) + "px"; hole.style.width = (r.width + pad * 2) + "px"; hole.style.height = (Math.min(r.height, window.innerHeight * 0.45) + pad * 2) + "px";
  const below = r.top + Math.min(r.height, window.innerHeight * 0.45) + 14, th = tip.offsetHeight || 120;
  tip.style.top = (below + th < window.innerHeight - 70 ? below : Math.max(12, r.top - th - 14)) + "px";
}
function showTourStep() {
  const st = TOUR[tourStep];
  if (st.settings) $("sheetSet").classList.add("open"); else { $("sheetSet").classList.remove("open"); showTab(st.tab); }
  const el = tourEl(st);
  if (!el) { if (tourStep < TOUR.length - 1) { tourStep++; showTourStep(); } else endTour(); return; } // nothing to point at: go on
  try { el.scrollIntoView({ block: "center" }); } catch (e) {}
  const last = tourStep === TOUR.length - 1;
  $("tourTip").innerHTML = "<p>" + esc(t(st.k)) + '</p><div class="row2"><button class="linkbtn" data-tour="skip">' + esc(t("onb_skip")) + '</button><span class="n">' + (tourStep + 1) + " / " + TOUR.length + '</span><button class="btn" data-tour="next">' + esc(t(last ? "tour_done" : "onb_next")) + "</button></div>";
  $("tourHole").hidden = $("tourTip").hidden = false;
  setTimeout(placeTour, 80); setTimeout(placeTour, 400);
}
$("tourTip").addEventListener("click", e => {
  const b = e.target.closest("[data-tour]"); if (!b) return;
  const a = b.dataset.tour;
  if (a === "keep") { hideTour(); tourDemo = false; return; }
  if (a === "drop") { hideTour(); tourDemo = false; removeDemo(); toast(t("demo_removed")); return; }
  if (a === "skip" || tourStep >= TOUR.length - 1) { endTour(); return; }
  tourStep++; showTourStep();
});

  const go = () => { theme = b.dataset.th; lsSet("pc_theme", theme); applyTheme(); };
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) { document.startViewTransition(go); return; } // smooth crossfade of the whole app
  document.documentElement.classList.add("themefade"); go(); setTimeout(() => document.documentElement.classList.remove("themefade"), 600);
});
$("selMain").onchange = e => { mainCur = e.target.value; lsSet("pc_main", mainCur); applyLang(); };
$("btnSettings").addEventListener("click", () => { renderQR(); $("btnDemo").hidden = !hasDemo(); $("btnClear").textContent = t(user ? "del_account" : "clear_all"); });
$("chkSrc").onchange = e => { showSrc = e.target.checked; lsSet("pc_showsrc", showSrc); renderAll(); };
// wipe everything on this phone (keeps language and theme) and start fresh
function wipeLocal() {
  try { Object.keys(localStorage).filter(k => k.startsWith("pc_") && !["pc_lang", "pc_theme"].includes(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  location.reload();
}
async function deleteAccount() {
  if (!confirm(t("del_confirm"))) return;
  try {
    const { error } = await sb.rpc("delete_my_account");
    if (error) throw error;
    try { await sb.auth.signOut(); } catch (e) {}
    user = null; toast(t("del_done")); setTimeout(wipeLocal, 900);
  } catch (e) { toast(t("err_other") + " " + String(e.message || e).slice(0, 80)); }
}
$("btnClear").onclick = async () => {
  if (sb && user) return deleteAccount();
  if (!confirm(t("confirm_clear"))) return;
  wipeLocal();
};
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  $("themeSw").innerHTML = Object.keys(THEMES).map(k => '<button data-th="' + k + '" class="' + (k === theme ? "on" : "") + '" title="' + esc(t("th_" + k)) + '" aria-label="' + esc(t("th_" + k)) + '"><i style="background:' + THEMES[k] + '"></i></button>').join("");
  $("themeName").textContent = t("th_" + theme);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#1f6f54";
}
function applyLang() {
  document.documentElement.lang = { zh: "zh-Hant", zhs: "zh-Hans" }[lang] || lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n) + (el.hasAttribute("data-cur") ? " (" + mainCur + ")" : ""); });
  $("selMain").innerHTML = curOptions(mainCur);
  $("quickIn").placeholder = t("quick_ph");
  $("selLang").innerHTML = Object.keys(LANGS).map(k => '<option value="' + k + '"' + (k === lang ? " selected" : "") + ">" + LANGS[k] + "</option>").join("");
  $("verLbl").textContent = t("version", { v: VERSION });
  $("chkSrc").checked = showSrc;
  $("btnDemo").hidden = !(typeof hasDemo === "function" && hasDemo());
  $("btnClear").textContent = t(typeof user !== "undefined" && user ? "del_account" : "clear_all");
  applyTheme(); renderBrake(); payLabels(); renderVoice(); renderAll();
  if (ob) renderOnb();
  $("setWage").value = wage || "";
  if (ed) renderExp(); if (qd) renderQuick(); if (wd) renderWish();
  if (typeof translateNames === "function") setTimeout(translateNames, 300);
}
function renderBrake() {
  const steps = p => '<ol>' + [1, 2, 3, 4].map(i => "<li>" + esc(t(p + i)) + "</li>").join("") + "</ol>";
  $("brakeBody").innerHTML = '<div class="brake"><p class="muted" style="margin:8px 0 0">' + esc(t("brake_intro")) + "</p><h5>Android</h5>" + steps("ba") + "<h5>iPhone</h5>" + steps("bi") + "</div>";
}
function renderAll() { renderWallet(); renderStats(); renderExps(); renderWant(); renderInsights(); renderFriends(); renderAcct(); }

// ===== START =====
applyLang();
showTab(["Spend", "Want", "Insight", "Friends"].includes(lsGet("pc_tab", "Spend")) ? lsGet("pc_tab", "Spend") : "Spend");
loadRates();
initSync();
if (!profile) openOnb();
try { if (sessionStorage.getItem("pc_justupdated")) { sessionStorage.removeItem("pc_justupdated"); toast(t("new_version") + " · " + t("version", { v: VERSION })); } } catch (e) {}
if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloaded) return; reloaded = true; try { sessionStorage.setItem("pc_justupdated", "1"); } catch (e) {} location.reload(); });
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
